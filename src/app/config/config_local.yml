app:
  name: "Story Flow Engine"
  version: "1.0.0"

logging:
  level: "debug"
  format: "%(levelname)s %(asctime)s - %(message)s"
  console:
    enabled: true
    colored: true

jira:
  url: "https://alonsovn.atlassian.net"
  api_token: !ENV ${JIRA_API_TOKEN}
  email: !ENV ${JIRA_EMAIL}
  api_version: "3"
  timeout: 30
  max_retries: 3
  rate_limit:
    requests_per_minute: 60
  project_key: "OPH"

